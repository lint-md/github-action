name: build

on: [ pull_request ]

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Install modules
        run: npm ci

      - name: Audit dependencies
        uses: OWASP/cve-lite-cli@32c21bb9c73050bc177b563633b3fe684825517c # v1.28.0
        with:
          version: '1.28.0'
          all: 'true'
          verbose: 'true'
          fail-on: medium

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Lint source
        run: npm run lint

      - name: Verify bundled Action
        run: |
          npm run build
          git diff --exit-code -- dist/

      - name: Smoke test bundled Action
        uses: ./
        with:
          files: './examples/only-warning'
          configFile: './examples/only-warning/.lintmdrc'
