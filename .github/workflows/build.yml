name: build

on: [ pull_request ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install modules
        run: npm ci

      - name: Audit dependencies
        uses: OWASP/cve-lite-cli@v1
        with:
          all: 'true'
          verbose: 'true'
          fail-on: medium

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Lint source
        run: npm run lint

      - name: Verify bundled Action
        run: |
          npm run build
          git diff --exit-code -- dist/

      - name: Smoke test bundled Action
        uses: ./
        with:
          files: './examples/only-warning'
          configFile: './examples/only-warning/.lintmdrc'
