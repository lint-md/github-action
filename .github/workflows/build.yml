name: build

on: [ pull_request ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install modules
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Lint source
        run: npm run lint

      - name: Verify bundled Action
        run: |
          npm run build
          git diff --exit-code -- dist/
